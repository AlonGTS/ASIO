[display]
show_local = false  # true for playback/debug with monitor, false for headless flight

[logging]
# Per-frame CSV instrumentation for the tracker-accuracy roadmap (see
# TRACKER_ACCURACY_ROADMAP.md, "Step A"). Written on a background thread via
# a bounded queue — rows are dropped rather than blocking the tracking loop
# if the disk falls behind, so this is safe to leave on in flight.
baseline_enabled = true
baseline_dir     = "logs"

[tracking]
max_bb_width = 120
max_bb_height = 120
# White-target mode (see gcs.py's WHITE TARGET button) switches from plain
# brightness-blob detection to dark-cross-centroid detection this many
# seconds after launch — up close (final few seconds before touchdown) the
# target fills much of the box with uneven brightness and blob detection
# starts landing on a corner of the sheet instead of its middle, which is
# exactly when the "+" mark is clearly resolved enough for cross detection
# to take over. 0 = never switch (stays on blob detection for the whole
# flight). Tune to your typical launch-to-touchdown flight duration, with a
# few seconds of margin before blob detection actually starts going wrong.
white_target_close_range_after_s = 12

# Close-range dark-cross detection tunables (see _find_cross_centroid in
# tracker-so.py) — the cross must cover between these two fractions of the
# sheet's interior area, and be at least this much darker than the sheet,
# to be accepted as a confident detection.
aim_cross_min_area_frac  = 0.01
aim_cross_max_area_frac  = 0.35
aim_cross_min_contrast   = 20

[gts-track.common]
use_hog             = true
use_color_names     = true
use_gray            = false
use_rgb             = true
use_channel_weights = true
use_segmentation    = false
window_function     = "hann"
kaiser_alpha        = 3.2
hog_clip            = 2.0
histogram_bins      = 16
background_ratio    = 2

[gts-track.fixed]
number_of_scales    = 33
scale_step          = 1.03
scale_lr            = 0.15
scale_sigma_factor  = 0.25
scale_model_max_area = 512
admm_iterations     = 9
template_size       = 160
filter_lr           = 0.08

[gts-track.moving]
number_of_scales    = 55
scale_step          = 1.02
scale_lr            = 0.65
scale_sigma_factor  = 0.30
scale_model_max_area = 1024
admm_iterations     = 6
template_size       = 200
filter_lr           = 0.25

[network]
flask_port = 5050  # temporary, local-testing only — macOS's AirPlay Receiver squats on
                    # the default 5000; every real Pi is fine leaving this unset
# "wlan0" = original network, "wlan1" = new USB dongle (MAHAT)
interface        = "wlan0"
gcs_udp_port     = 5600
gcs_cmd_port     = 5601
gcs_jpeg_quality = 80     # was 60 — lower = smaller frames (~12 KB vs ~35 KB)
gcs_stream_width = 640  # was 640 — scale before encode (~3 Mbps vs ~8 Mbps @ 30fps)
# Cap on JPEG-encode-and-send rate to the GCS, independent of camera capture/
# active_fps — tracking and MAVLink still run at full active_fps regardless.
# Lower this to cut CPU (encode+resize is the priciest per-frame stream cost).
# 0 = uncapped (encode every frame the tracker publishes).
gcs_stream_fps   = 15

# Video transport: "jpeg_udp" = current JPEG-over-UDP for gcs.py
#                  "webrtc"   = H.264 WebRTC served at http://<pi>:8080
#                  "h264_udp" = H.264 over raw RTP/UDP (h264_udp_server.py +
#                               gcs.py's _H264LiveCapture) — hardware encoder
#                               (Pi 4/CM4) used automatically if present,
#                               software (libx264) fallback otherwise. Lower
#                               latency and bandwidth than jpeg_udp at the
#                               same resolution; connectionless like jpeg_udp
#                               (no handshake, auto-recovers after packet
#                               loss/Wi-Fi drops at the next keyframe).
video_mode           = "h264_udp"
webrtc_bitrate_kbps  = 0   # 0 = unconstrained; set e.g. 800 for narrow RF links

# h264_udp mode only. Reuses gcs_udp_port/gcs_stream_width/gcs_stream_fps
# above for the socket, resize, and send-rate — these three are h264-specific:
h264_bitrate_kbps = 2000   # target encoder bitrate
h264_gop_seconds  = 0.5    # I-frame interval (~15 frames @ 30fps feed, less at a lower gcs_stream_fps)
h264_rtp_payload  = 1200   # max NAL bytes per UDP/RTP packet — keeps packets MTU-safe (no IP fragmentation)

[network.wlan0]
bind_ip = "192.168.1.35"
# gcs_ip no longer needed — Pi learns GCS IP dynamically from heartbeat packets

[network.wlan1]
bind_ip = "192.168.10.2"
gcs_ip  = "192.168.10.7"

[mavlink]
# "custom" = our own Simulink-generated flight control (MAHAT PX4 app):
#            sends DEBUG_VECT "vision_err" (pitch/yaw/tracking) + NAMED_VALUE_FLOAT
#            "launch"; the FC-side app owns all attitude control.
# "px4"    = stock PX4 flight stack: drives OFFBOARD mode directly via
#            SET_ATTITUDE_TARGET (body rates), with MAV_CMD_DO_SET_MODE /
#            MAV_CMD_COMPONENT_ARM_DISARM for mode switching and arm/disarm.
autopilot     = "custom"
# mavproxy_path: usually leave unset — auto-detected next to whichever venv's
# python is running tracker-so.py, so this doesn't need editing per RPi.
# Only set this if a given Pi keeps mavproxy in a separate venv from the one
# running the tracker.
# mavproxy_path = "/home/mahat/mav_venv/bin/mavproxy.py"
pixhawk_port  = "/dev/serial/by-id/usb-Auterion_PX4_FMU_v6C.x_0-if00"
pixhawk_baud  = 115200
gcs_ip        = "192.168.1.30"    # legacy field (kept for reference)
gcs_port      = 14550
local_port    = 14551
# Dedicated unicast outputs — MAVProxy sends a copy to each IP:gcs_port
# Add every QGC / GCS machine here that needs full telemetry
extra_outputs = ["192.168.10.8", "10.50.117.41", "192.168.1.34", "192.168.1.43", "192.168.1.32"]

[camera]
# Safe/default resolutions for IMX708 path
main_sizes  = [[640, 480], [960, 540], [1280, 720], [1640, 1232]]
lores_sizes = [[320, 240], [416, 312], [512, 384], [640,  480], [800, 600], [960, 540], [1280, 720], [1640, 1232]]

# Capture starts at idle_fps (low CPU/heat) and only switches to active_fps
# when the GCS operator explicitly toggles it (FPS button / F key in gcs.py).
# MAVLink keeps flowing at either rate — it's handled by mavproxy, not this loop.
idle_fps   = 10
active_fps = 30
